version: '3.4'
services:
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Stubs DEFRA ID (OIDC) for local sign-in — see README for test-user setup.
  # https://github.com/DEFRA/cdp-defra-id-stub
  cdp-defra-id-stub:
    image: defradigital/cdp-defra-id-stub:latest
    ports:
      - '3200:3200'
    links:
      - 'redis:redis'
    depends_on:
      redis:
        condition: service_started
    environment:
      PORT: 3200
      NODE_ENV: development
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
      # In-memory registrations store — no DynamoDB/Floci wiring needed for
      # the stub locally; test users don't need to survive a restart.
      REGISTRATIONS_STORE_ENGINE: memory
    networks:
      - cdp-tenant

  ################################################################################

  your-frontend:
    build: ./
    ports:
      - '3000:3000'
    links:
      - 'floci:floci'
      - 'redis:redis'
      - 'cdp-defra-id-stub:cdp-defra-id-stub'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_started
      cdp-defra-id-stub:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      LOG_FORMAT: pino-pretty
      SESSION_COOKIE_SECURE: false
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
    # cdp-defra-id-stub's well-known document advertises its endpoints as
    # http://localhost:3200 (its own default `appBaseUrl`). That's correct
    # for the browser (compose publishes 3200:3200 on the host), but from
    # inside this container "localhost" would otherwise mean itself, not the
    # stub. Rewriting it to the host gateway routes container-side calls
    # (token exchange, JWKS fetch) back through the same published port.
    extra_hosts:
      - 'localhost:host-gateway'
    networks:
      - cdp-tenant

  # your-backend:
  #   image: defradigital/your-backend:${YOUR_BACKEND_VERSION:-latest}
  #   ports:
  #     - '3555:3555'
  #   links:
  #     - 'foci:floci'
  #     - 'mongodb:mongodb'
  #   depends_on:
  #     floci:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_started
  #   env_file:
  #     - 'compose/aws.env'
  #   environment:
  #     PORT: 3001
  #     NODE_ENV: development
  #     MONGO_URI: mongodb://mongodb:27017/
  #   networks:
  #     - cdp-tenant

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
