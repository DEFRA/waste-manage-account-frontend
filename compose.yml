# Local development stack following the CDP node frontend template:
# the app plus Redis (session cache), MongoDB (CDP platform parity — unused
# by this frontend yet), and Floci for AWS emulation on port 4566.
#
# Defra ID (spec 002) has no container here: `npm run demo` runs the real
# OIDC path locally against an in-process mock IdP with zero external
# network (see README.md "Demo: Defra ID sign-in"). For a containerized
# team-wide stub instead of the bundled mock, add Defra's official image
# (https://github.com/DEFRA/cdp-defra-id-stub) as its own service, e.g.:
#
#   defra-id-stub:
#     image: defradigital/cdp-defra-id-stub:latest
#     ports:
#       - '3200:3200'
#     networks:
#       - cdp-tenant
#
# ...then point DEFRA_ID_DISCOVERY_URL at it instead of CPDEV.
services:
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.hello().ok']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ################################################################################

  waste-manage-account-frontend:
    build: ./
    ports:
      - '3000:3000'
    depends_on:
      floci:
        # The floci image ships its own HEALTHCHECK hitting /_floci/health.
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      SESSION_CACHE_ENGINE: redis
    networks:
      - cdp-tenant

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
